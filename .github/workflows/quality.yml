name: PassBit QA
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static and numerical regression tests
        run: node tests/smoke.mjs
